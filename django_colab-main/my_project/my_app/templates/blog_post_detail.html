{% extends 'base.html' %}




{% block content %}

{% if blog_post.cover_image %}
  <div class="cover-image" style="text-align: center; margin-bottom: 20px;">
    <img src="{{ blog_post.cover_image.url }}" alt="Cover Image" style="max-width: 100%; height: auto;">
  </div>
{% endif %}
<div class="blog-post" style="background-color: #e8d292; color:black;">
  <h2>{{ blog_post.title }}</h2>
  <h6  style="color: black;" >by {{ blog_post.author }}</h6>
  <p>{{ blog_post.content }}</p>
    <a href="{% url 'blog_post_update' pk=blog_post.pk %}" class="btn btn-warning">Edit</a>
    <a href="{% url 'blog_post_delete' pk=blog_post.pk %}" class="btn btn-danger">Delete</a>
  </div>
{% endblock %}
