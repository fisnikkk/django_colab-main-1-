{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4 p-4" style="background-color: rgba(255,255,255,0.7);">
  <h1 style="color: black;">{{ blog_post.title }}</h1>
  <p style="color: black;"><strong>by {{ blog_post.author }}</strong></p>

  {% if blog_post.cover_image %}
    <!-- Small thumbnail, clickable to open the modal -->
    <img
      src="{{ blog_post.cover_image.url }}"
      alt="{{ blog_post.title }}"
      style="max-width: 300px; height:auto; cursor: pointer; border: 2px solid #c22;"
      data-bs-toggle="modal"
      data-bs-target="#imageModal"
    >
  {% endif %}

  <p style="color: black;">{{ blog_post.content|linebreaksbr }}</p>

  <hr>
  <a href="{% url 'blog_post_update' blog_post.pk %}" class="btn btn-warning">Edit</a>
  <a href="{% url 'blog_post_delete' blog_post.pk %}" class="btn btn-danger">Delete</a>
</div>

<!-- The Bootstrap 5 modal: hidden by default, triggered by data-bs-toggle above. -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content" style="background-color: #000; border: none;">
      <button type="button" class="btn-close ms-auto m-2" data-bs-dismiss="modal" aria-label="Close"></button>
      <div class="modal-body p-0">
        {% if blog_post.cover_image %}
          <img src="{{ blog_post.cover_image.url }}" alt="Modal Fullsize"
               style="width: 100%; height: auto;">
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
